<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code™ Generator | SI Tools</title>
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <header class="tool-header">
      <nav class="top-nav" aria-label="Main navigation">
        <a href="../index.html">← Back to SI Tools</a>
      </nav>
      <h1>QR Code™ Generator</h1>
    </header>

    <main class="tool-card">
      <div class="field-group">
        <label for="qr-input">Text or URL</label>
        <div class="button-row">
          <input id="qr-input" type="text" placeholder="https://example.com" aria-label="Text or URL to encode into a QR Code™">
        </div>
      </div>

      <div class="button-row center">
        <button id="generate-qr">Generate QR</button>
        <button id="download-qr" class="secondary">Download .jpg</button>
      </div>

      <div class="qr-wrapper">
        <canvas id="qr-canvas" width="240" height="240" aria-label="Generated QR Code™"></canvas>
      </div>

      <p id="qr-status" class="status" aria-live="polite">Enter text or a URL and generate a QR Code™.</p>
    </main>

    <script src="./script.js"></script>
  </body>
</html>
